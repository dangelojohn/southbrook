services:

  postgres:
    image: postgres:16
    container_name: southbrook-postgres
    restart: unless-stopped
    networks: [southbrook-net]
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /share/CACHEDEV3_DATA/Container/southbrook/postgres-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d southbrook"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  odoo:
    image: odoo:19
    container_name: southbrook-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    networks: [southbrook-net]
    expose: ["8069", "8072"]
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /share/CACHEDEV3_DATA/Container/southbrook/odoo-data:/var/lib/odoo
      - /share/CACHEDEV3_DATA/Container/southbrook/config:/etc/odoo:ro
      - /share/CACHEDEV3_DATA/Container/southbrook/addons:/mnt/extra-addons
      - /share/CACHEDEV3_DATA/Container/southbrook/logs:/var/log/odoo
    command: ["odoo", "--config=/etc/odoo/odoo.conf"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  southbrook-net:
    external: true
