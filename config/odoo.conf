[options]
; ===== Server =====
admin_passwd = REDACTED_SEE_admin-creds.txt

; ===== Database =====
db_host = postgres
db_port = 5432
db_user = odoo
db_password = REDACTED_SEE_.env
db_maxconn = 16
list_db = False

; ===== Addons =====
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; ===== Workers (lighter than alfacore - demo only) =====
workers = 2
max_cron_threads = 1
limit_memory_soft = 805306368
limit_memory_hard = 1207959552
limit_time_cpu = 300
limit_time_real = 600
limit_request = 8192

; ===== Logging =====
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log
logrotate = True

; ===== Reverse proxy =====
proxy_mode = True
xmlrpc = True
longpolling_port = 8072

; ===== Data + DB pinning =====
data_dir = /var/lib/odoo
dbfilter = ^southbrook$
